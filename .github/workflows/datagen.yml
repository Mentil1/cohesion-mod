# Runs Fabric data generation and checks it against the hand written files.
# Put [finalize] in a commit message on this branch to swap the hand written files for the generated ones.

name: datagen
on:
  workflow_dispatch:
  push:
    branches: [datagen]

permissions:
  contents: write

jobs:
  datagen:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: run datagen
        run: ./gradlew runDatagen
      - name: compare generated files with the hand written ones
        run: python3 scripts/compare_generated.py
      - name: upload generated files
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: generated
          path: src/main/generated/
          if-no-files-found: ignore
      - name: swap hand written files for generated ones
        if: contains(github.event.head_commit.message, '[finalize]')
        run: |
          python3 scripts/compare_generated.py --remove-handwritten
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/main
          git commit -m "switch to generated resources [skip ci]"
          git push
