# one-off: list the Minecraft model generator methods
name: probe
on: push

jobs:
  probe:
    if: contains(github.event.head_commit.message, '[probe]')
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: download minecraft
        run: ./gradlew compileJava
      - name: list the model generator api
        run: |
          for J in $(find ~/.gradle -name '*.jar' -path '*loom*'); do
            if unzip -l "$J" 2>/dev/null | grep -q 'net/minecraft/client/data/models/BlockModelGenerators.class'; then JAR="$J"; break; fi
          done
          echo "PROBE jar: $JAR"
          echo "PROBE ---- BlockModelGenerators"
          javap -p -cp "$JAR" net.minecraft.client.data.models.BlockModelGenerators | grep -iE "family|wall|stairs|slab|trivial" | sed 's/^/PROBE /'
          echo "PROBE ---- BlockFamilyProvider"
          javap -p -cp "$JAR" 'net.minecraft.client.data.models.BlockModelGenerators$BlockFamilyProvider' | sed 's/^/PROBE /'
          echo "PROBE ---- TextureMapping"
          javap -p -cp "$JAR" net.minecraft.client.data.models.model.TextureMapping | grep -iE "cube|wall|all|get\(" | sed 's/^/PROBE /'
